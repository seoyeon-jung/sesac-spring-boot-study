<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스터디 참가 신청</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      color: #1f2328;
    }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 24px; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .card {
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      padding: 16px;
    }
    .card h2 { font-size: 15px; margin: 0 0 10px; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #2f6feb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #1f5bd1; }
    button.secondary { background: #6e7781; }
    button.secondary:hover { background: #57606a; }
    .section { margin-top: 16px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    pre {
      margin: 0;
      padding: 12px;
      background: #f6f8fa;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 14px;
      line-height: 1.6;
      min-height: 44px;
    }
    #result.success { border-left: 4px solid #1a7f37; }
    #result.fail { border-left: 4px solid #cf222e; }
  </style>
</head>
<body>
<main>
  <h1>스터디 참가 신청</h1>

  <div class="grid">
    <div class="card">
      <h2>참가 신청</h2>
      <form id="applyForm">
        <input id="nameInput" placeholder="이름">
        <button type="submit">신청</button>
      </form>
    </div>
    <div class="card">
      <h2>신청 취소</h2>
      <form id="cancelForm">
        <input id="memberIdInput" placeholder="id">
        <button type="submit">취소</button>
      </form>
    </div>
    <div class="card">
      <h2>정원 변경 (1~10)</h2>
      <form id="capacityForm">
        <input id="capacityInput" placeholder="정원">
        <button type="submit">변경</button>
      </form>
    </div>
  </div>

  <div class="card section">
    <h2>처리 결과</h2>
    <pre id="result">요청 결과가 여기에 표시됩니다.</pre>
  </div>

  <div class="card section">
    <div class="row">
      <h2 style="margin:0">참가자 명단</h2>
      <button class="secondary" id="refreshBtn" type="button">새로고침</button>
    </div>
    <pre id="list">불러오는 중...</pre>
  </div>
</main>

<script>
  const resultBox = document.getElementById('result');
  const listBox = document.getElementById('list');

  function showResult(text) {
    resultBox.textContent = text;
    resultBox.className = text.includes('실패') ? 'fail' : 'success';
  }

  async function post(url, key, value) {
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ [key]: value })
      });
      showResult(await response.text());
    } catch (e) {
      showResult('서버에 연결하지 못했습니다. 실패: ' + e.message);
    }
    loadList();
  }

  async function loadList() {
    try {
      const response = await fetch('/study/participants');
      listBox.textContent = await response.text();
    } catch (e) {
      listBox.textContent = '명단을 불러오지 못했습니다.';
    }
  }

  document.getElementById('applyForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('nameInput');
    post('/study/participants', 'name', input.value);
    input.value = '';
  });

  document.getElementById('cancelForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('memberIdInput');
    post('/study/cancel', 'memberId', input.value);
    input.value = '';
  });

  document.getElementById('capacityForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('capacityInput');
    post('/study/capacity', 'capacity', input.value);
    input.value = '';
  });

  document.getElementById('refreshBtn').addEventListener('click', loadList);

  loadList();
</script>
</body>
</html>
